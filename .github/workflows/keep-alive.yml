name: Keep Alive (Supabase + Render)

on:
  schedule:
    - cron: "0 5,17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (consulta simple via REST)
        run: |
          STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/usuarios?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase status: $STATUS"
          echo "Respuesta: $(cat response.txt | head -c 300)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase respondio $STATUS"
            exit 1
          fi

      - name: Ping backend en Render (lo despierta)
        run: |
          curl -s -o /dev/null -w "Render status: %{http_code}\n" \
            "https://medcare-sistema.onrender.com/" || true